import { createFileRoute } from "@tanstack/react-router";

/**
 * Scheduled offers refresh. Call with:
 *   POST /api/public/sync-offers   header: x-sync-token: <OFFERS_SYNC_TOKEN>
 * Now also lights up every tower that has a feed.
 */
export const Route = createFileRoute("/api/public/sync-offers")({
  server: {
    handlers: {
      POST: async ({ request }) => {
        const expected = process.env["OFFERS_SYNC_TOKEN"];
        const provided = request.headers.get("x-sync-token") ?? "";
        if (!expected || provided.length !== expected.length || provided !== expected) {
          return new Response("Unauthorized", { status: 401 });
        }

        const { syncAllCompanyOffers } = await import("@/lib/offers-sync.server");

        const result = await syncAllCompanyOffers();

        // ملاحظة: كنا هنا بننادي syncAllTowers() اللي بتضيء وحدات البرج بمنطق
        // قديم (أول N وحدة بترتيب unit_number بدون أي اعتبار للواجهات face/floor/slot
        // ولا لحصص الشركة الرئيسية/المحجوز/الإيجار). هذا كان بيتعارض تلقائياً كل
        // 6-12 ساعة مع نظام توزيع 12(أعلى)+8(أرضي)/10(محجوز)/10(إيجار) الجديد
        // في provisionTowerLayout و linkTowerUnitsToMarket، ويفسّر تفاوت الأعداد
        // بين الأوجه وتكرار/تجاوز التصنيفات المخصصة. عُطِّل عمداً — ربط البرج
        // بالتصنيفات يتم الآن فقط يدوياً من لوحة الأدمن (زر «ربط بالبرج»).
        const towers: unknown = [];

        return Response.json({ ...result, towers });
      },
    },
  },
});
