name: Update Feed From Alibaba

on:
  schedule:
    - cron: "0 */12 * * *"   # كل 12 ساعة
  workflow_dispatch: {}      # زر يدوي

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate feed.json
        run: node scripts/generate-feed.mjs

      - name: Commit & push
        run: |
          git config user.name "offers-bot"
          git config user.email "offers-bot@users.noreply.github.com"
          git add feed.json
          git diff --staged --quiet || git commit -m "chore: refresh alibaba feed [skip ci]"
          git push

      - name: Trigger app sync
        run: |
          curl -sS -X POST "${{ secrets.SITE_URL }}/api/public/sync-offers" \
            -H "x-sync-token: ${{ secrets.OFFERS_SYNC_TOKEN }}" || true
