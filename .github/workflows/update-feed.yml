name: Update Offers Feed

on:
  schedule:
    - cron: "0 */12 * * *"   # كل 12 ساعة
  workflow_dispatch: {}      # تشغيل يدوي

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate feed.json
        env:
          # كل أسرار المستودع تُمرَّر هنا، فإضافة سرّ لشركة جديدة لا تحتاج تعديل هذا الملف
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: node scripts/generate-feed.mjs

      - name: Commit & push
        run: |
          git config user.name "offers-bot"
          git config user.email "offers-bot@users.noreply.github.com"
          git add feed.json
          git diff --staged --quiet || git commit -m "chore: refresh offers feed [skip ci]"
          git push

      - name: Trigger MERCORA sync
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          OFFERS_SYNC_TOKEN: ${{ secrets.OFFERS_SYNC_TOKEN }}
        run: |
          if [ -z "$SITE_URL" ]; then echo "SITE_URL غير مضبوط — تخطي المزامنة"; exit 0; fi
          curl -sS -f -X POST "$SITE_URL/api/public/sync-offers" -H "x-sync-token: $OFFERS_SYNC_TOKEN"
